<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src https://script.google.com https://script.googleusercontent.com; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b1730">
<meta name="description" content="AI Virtual Office 3D — kantor virtual dengan karyawan AI yang merencanakan, mengerjakan, dan memeriksa pekerjaan.">
<title>AI Virtual Office 3D</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="avo-style">
:root{--bg:#f3f5f9;--surface:#fff;--surface-2:#f7f9fc;--border:#e2e7ef;--text:#0f1b2d;--muted:#5d6b82;--primary:#1f5eff;--primary-soft:rgba(31,94,255,.1);--nav:#0b1730;--nav-2:#13254a;--nav-text:#c3cee2;--success:#0e9f6e;--warning:#c27803;--danger:#d92d20;--info:#0b8ab5;--violet:#7c3aed;--radius:12px;--shadow:0 1px 2px rgba(15,27,45,.06),0 4px 16px rgba(15,27,45,.06);--font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--safe-b:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0a1120;--surface:#111b2f;--surface-2:#0e1729;--border:#1f2c47;--text:#e7ecf6;--muted:#93a3bf;--primary-soft:rgba(77,124,255,.16);--nav:#070e1c;--nav-2:#10203f;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1120;--surface:#111b2f;--surface-2:#0e1729;--border:#1f2c47;--text:#e7ecf6;--muted:#93a3bf;--primary-soft:rgba(77,124,255,.16);--nav:#070e1c;--nav-2:#10203f;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25)}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--primary)}button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.25;letter-spacing:-.01em}h1{font-size:22px}h2{font-size:18px}h3{font-size:15px}
.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}.grow{flex:1}.right{margin-left:auto}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--nav);color:var(--nav-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:16px 12px;gap:4px;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:8px}
.logo{width:40px;height:40px;border-radius:10px;object-fit:cover;background:#fff;cursor:zoom-in;flex:none;border:1px solid rgba(255,255,255,.15)}
.brand b{color:#fff;font-size:14px;display:block;line-height:1.2}.brand span{font-size:11px;opacity:.75}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--nav-text);text-decoration:none;font-weight:500;font-size:13.5px}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}.nav a.on{background:var(--nav-2);color:#fff;box-shadow:inset 3px 0 0 var(--primary)}
.nav .sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.55;padding:14px 10px 4px}
.badge{margin-left:auto;background:var(--danger);color:#fff;border-radius:999px;font-size:11px;padding:0 7px;line-height:18px;font-weight:600}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 22px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.top .ttl{min-width:0}.top .ttl b{font-size:16px;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top .ttl small{color:var(--muted);font-size:12px}
.top .logo{display:none;width:34px;height:34px;border-color:var(--border)}
.iconbtn{border:1px solid var(--border);background:var(--surface);width:36px;height:36px;border-radius:10px;display:inline-grid;place-items:center;cursor:pointer;position:relative;color:var(--text)}
.iconbtn:hover{background:var(--surface-2)}.iconbtn .badge{position:absolute;top:-6px;right:-6px}
.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--primary-soft);color:var(--primary);display:inline-grid;place-items:center;font-weight:700;font-size:13px;flex:none;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--border)}
.avatar.lg{width:96px;height:96px;font-size:30px;cursor:zoom-in}
.view{padding:22px;max-width:1440px;width:100%;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card.flat{box-shadow:none}.card h3{display:flex;align-items:center;gap:8px}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em}.kpi .l{color:var(--muted);font-size:12px;font-weight:500}
.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff!important}.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--border))}.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;font-size:12px}.btn:disabled{opacity:.55;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.chip::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}.chip.plain::before{display:none}
.s-completed,.s-working,.s-approved,.s-active,.s-ok{color:var(--success);background:color-mix(in srgb,var(--success) 10%,transparent);border-color:transparent}
.s-running,.s-queued,.s-retrying,.s-draft{color:var(--primary);background:var(--primary-soft);border-color:transparent}
.s-pending_approval,.s-waiting_human,.s-waiting,.s-pending,.s-needs_clarification,.s-waiting_dependency{color:var(--warning);background:color-mix(in srgb,var(--warning) 12%,transparent);border-color:transparent}
.s-failed,.s-error,.s-rejected,.s-expired,.s-denied{color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent);border-color:transparent}
.s-cancelled,.s-idle,.s-inactive{color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:12.5px}label.f span{font-weight:400;color:var(--muted);font-size:12px}
input.i,select.i,textarea.i{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:9px 11px;width:100%;outline:none;font-weight:400;font-size:14px}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}textarea.i{resize:vertical;min-height:90px}
.tbl-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;background:var(--surface-2);padding:9px 12px;position:sticky;top:0}
table.t td{padding:9px 12px;border-top:1px solid var(--border);vertical-align:top}table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:var(--surface-2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto}.tabs button{border:0;background:none;padding:9px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}.tabs button.on{color:var(--primary);border-color:var(--primary)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--border)}.bar>i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .4s}
.notice{display:flex;gap:10px;padding:11px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);font-size:13px}.notice.warn{border-color:color-mix(in srgb,var(--warning) 40%,transparent);background:color-mix(in srgb,var(--warning) 8%,var(--surface))}.notice.err{border-color:color-mix(in srgb,var(--danger) 40%,transparent);background:color-mix(in srgb,var(--danger) 7%,var(--surface))}
.md{line-height:1.65;overflow-wrap:anywhere}.md h1{font-size:19px}.md h2{font-size:16px;margin-top:1em}.md h3{font-size:14px;margin-top:.9em}.md pre,.pre{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px;overflow:auto;white-space:pre-wrap;font-size:12px;max-height:420px}.md table{border-collapse:collapse;margin:8px 0;display:block;overflow:auto}.md td,.md th{border:1px solid var(--border);padding:4px 8px;font-size:12.5px}.md code{background:var(--surface-2);padding:1px 5px;border-radius:5px;font-size:12px}.md blockquote{margin:6px 0;padding:4px 12px;border-left:3px solid var(--primary);color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(6,12,24,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;animation:fade .15s}
.modal{background:var(--surface);border-radius:14px;width:min(760px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35);border:1px solid var(--border)}
.modal.wide{width:min(1040px,100%)}.modal header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}.modal header h2{margin:0;font-size:16px}
.modal .body{padding:18px;overflow:auto}.modal footer{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:90;box-shadow:-10px 0 40px rgba(0,0,0,.2);display:flex;flex-direction:column;animation:slide .2s;border-left:1px solid var(--border)}
.drawer header{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}.drawer .body{padding:16px;overflow:auto;flex:1}
@keyframes fade{from{opacity:0}}@keyframes slide{from{transform:translateX(30px);opacity:0}}
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:min(380px,calc(100% - 32px))}
.toast{background:var(--nav);color:#fff;padding:11px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13px;animation:fade .2s;border-left:4px solid var(--primary)}.toast.err{border-left-color:var(--danger)}.toast.ok{border-left-color:var(--success)}
.lightbox{position:fixed;inset:0;background:rgba(3,7,15,.92);z-index:300;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none}
.lightbox img{max-width:90vw;max-height:80vh;transform-origin:center;cursor:grab;will-change:transform;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.lightbox .lb-bar{position:absolute;bottom:calc(20px + var(--safe-b));left:50%;transform:translateX(-50%);display:flex;gap:6px;background:rgba(255,255,255,.1);padding:6px;border-radius:12px;backdrop-filter:blur(6px)}
.lightbox .lb-bar button{background:rgba(255,255,255,.12);color:#fff;border:0;width:40px;height:40px;border-radius:9px;font-size:18px;cursor:pointer}.lightbox .lb-bar span{color:#fff;align-self:center;min-width:52px;text-align:center;font-size:13px}
.lightbox .lb-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.14);color:#fff;border:0;width:42px;height:42px;border-radius:50%;font-size:20px;cursor:pointer}
.office-wrap{display:grid;grid-template-columns:1fr 320px;gap:14px}
.stage{position:relative;height:calc(100vh - 150px);min-height:440px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);background:linear-gradient(180deg,#dfe7f5,#f4f7fc)}
:root[data-theme="dark"] .stage{background:linear-gradient(180deg,#0d1a33,#0a1222)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.stage .ctrl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}.stage .ctrl .iconbtn{background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(4px)}
.stage .legend{position:absolute;left:12px;bottom:12px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:11.5px;display:flex;gap:10px;flex-wrap:wrap;max-width:calc(100% - 24px)}
.lbl{position:absolute;transform:translate(-50%,-100%);pointer-events:none;background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--border);border-radius:8px;padding:3px 8px;font-size:11px;white-space:nowrap;box-shadow:var(--shadow);font-weight:600}
.lbl small{display:block;font-weight:500;color:var(--muted);max-width:170px;overflow:hidden;text-overflow:ellipsis}
.room-lbl{position:absolute;transform:translate(-50%,-50%);pointer-events:none;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;opacity:.8;white-space:nowrap}
.feed{max-height:calc(100vh - 470px);min-height:160px;overflow:auto;display:flex;flex-direction:column;gap:8px}.feed div{font-size:12.5px;border-left:2px solid var(--border);padding-left:9px}
.emp-row{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;cursor:pointer}.emp-row:hover{background:var(--surface-2)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.steps{display:flex;flex-direction:column;gap:8px}.step{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2)}.step .n{width:26px;height:26px;border-radius:8px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.tpl{cursor:pointer}.tpl:hover{border-color:var(--primary);color:var(--primary)}
.emp-card{cursor:pointer;transition:transform .12s,box-shadow .12s}.emp-card:hover{transform:translateY(-2px)}
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login .art{background:radial-gradient(1200px 600px at 10% 0%,#21408a 0%,#0b1730 55%,#060d1c 100%);color:#dbe5fb;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login .art h1{color:#fff;font-size:34px;max-width:520px;letter-spacing:-.02em}.login .art p{max-width:480px;opacity:.85;font-size:15px}
.login .form{display:flex;align-items:center;justify-content:center;padding:32px}.login .box{width:min(400px,100%)}
.bnav{display:none}
.skel{background:linear-gradient(90deg,var(--surface-2),var(--border),var(--surface-2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px;height:14px}@keyframes sk{to{background-position:-200% 0}}
.offline-bar{background:var(--warning);color:#fff;text-align:center;font-size:12.5px;padding:5px;font-weight:600}
.chart-bars{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:8px}.chart-bars div{flex:1;background:var(--primary);border-radius:4px 4px 0 0;min-height:2px;position:relative}.chart-bars div:hover{filter:brightness(1.2)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.office-wrap{grid-template-columns:1fr}.feed{max-height:260px}.stage{height:58vh}}
@media (max-width:900px){
 .shell{grid-template-columns:1fr}.side{display:none}.top{padding:10px 14px}.top .logo{display:block}
 .view{padding:14px 12px calc(84px + var(--safe-b))}.g3,.g2{grid-template-columns:1fr}
 .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--border);padding:6px 4px calc(6px + var(--safe-b))}
 .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);text-decoration:none;font-weight:600;position:relative;padding:4px 0}
 .bnav a.on{color:var(--primary)}.bnav .badge{position:absolute;top:-2px;right:calc(50% - 22px)}
 .login{grid-template-columns:1fr}.login .art{padding:28px;min-height:auto}.login .art h1{font-size:24px}.login .art .hide-m{display:none}
 .modal-bg{padding:0;align-items:flex-end}.modal{border-radius:16px 16px 0 0;max-height:92vh}.toasts{bottom:calc(76px + var(--safe-b))}
 .hide-m{display:none!important}
}
@media (max-width:520px){.g4{grid-template-columns:1fr 1fr}.kpi .v{font-size:20px}.top .ttl small{display:none}}
@media print{.side,.top,.bnav{display:none}.shell{display:block}}
</style>
</head>
<body>
<noscript>Aplikasi ini membutuhkan JavaScript.</noscript>
<div id="app"><div style="display:grid;place-items:center;height:100vh;color:#5d6b82">Memuat AI Virtual Office…</div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
